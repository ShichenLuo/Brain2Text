[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain2text"
version = "0.1.0"
description = "Research code for decoding neural signals into phonemes and language."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "torch>=2.0",
    "tqdm>=4.66",
    "datasets>=2.19",
    "transformers>=4.41",
    "peft>=0.11",
]

[project.optional-dependencies]
phonemes = ["g2p-en>=2.1"]
legacy-decoding = ["pyctcdecode>=0.5"]
dev = ["pytest>=7.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
